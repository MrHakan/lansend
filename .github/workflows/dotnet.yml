name: .NET Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LANSEND.sln

      - name: Build
        run: dotnet build LANSEND.sln --configuration Release --no-restore

      - name: Publish
        run: >-
          dotnet publish LANSEND/LANSEND.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/publish

      - name: Include setup scripts
        shell: pwsh
        run: Copy-Item -Path LANSEND/Scripts -Destination artifacts/publish/Scripts -Recurse -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANSEND-win-x64
          path: artifacts/publish
